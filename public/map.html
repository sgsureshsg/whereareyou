<!DOCTYPE html>
<html>
<head>
  <title>Driver Locations Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  var map = L.map('map').setView([20.5937, 78.9629], 5); // Centered at India

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  var markers = {};

  function updateMap() {
    fetch('/locations')
      .then(response => response.json())
      .then(data => {
        // Remove existing markers
        for (let id in markers) {
          map.removeLayer(markers[id]);
        }
        markers = {};

        // Add new markers
        for (let driverId in data) {
          const driver = data[driverId];
          const marker = L.marker([driver.lat, driver.lng])
            .addTo(map)
            .bindPopup(driverId);
          markers[driverId] = marker;
        }
      });
  }

  setInterval(updateMap, 10000); // Refresh every 10 seconds
  updateMap(); // First load
</script>

</body>
</html>
